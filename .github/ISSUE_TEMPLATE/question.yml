name: Question
description: 使用上的问题（不是 bug）
title: '[q] '
labels: question
body:
  - type: markdown
    attributes:
      value: |
        提问前先看两处：
        - README 的 [点了没反应怎么办](https://github.com/shalilongfei/dsh-computer-use#点了没反应怎么办) 和 [FAQ](https://github.com/shalilongfei/dsh-computer-use#faq)
        - 先跑 `computer { "type": "diagnose" }`，贴一下输出

  - type: textarea
    id: question
    attributes:
      label: 你的问题
      description: 说清场景：你让模型做什么、它做了什么、你期望它做什么
    validations:
      required: true

  - type: textarea
    id: diagnose
    attributes:
      label: diagnose 输出
      render: json
      description: 跑 `computer { "type": "diagnose" }` 的返回
    validations:
      required: false

  - type: input
    id: env
    attributes:
      label: 环境
      description: Windows 版本 + DSH 版本 + 插件版本
      placeholder: Win11 23H2 / DSH 0.2.0 / plugin 0.3.0
    validations:
      required: true
